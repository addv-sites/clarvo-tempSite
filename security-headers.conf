# Incluido con "include" dentro de CADA location del server block.
# Gotcha real de nginx (confirmado con curl contra el contenedor real):
# un add_header definido en un location NO hereda los add_header del
# bloque server padre -- los REEMPLAZA por completo. Como cada location
# de este sitio ya necesita su propio add_header de Cache-Control, la
# unica forma de que las cabeceras de seguridad lleguen a TODAS las
# respuestas es declararlas de nuevo en cada location, via este include,
# en vez de una sola vez arriba en el server block.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.google-analytics.com https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://www.google-analytics.com; font-src 'self' data:; connect-src 'self' https://www.google-analytics.com https://*.google-analytics.com https://*.analytics.google.com https://script.google.com https://script.googleusercontent.com https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; frame-ancestors 'none'" always;
