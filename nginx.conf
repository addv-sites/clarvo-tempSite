server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Nunca expuesto directo a Internet (ver docker-compose.prod.yml,
    # publicado solo en 127.0.0.1) -- el nginx del HOST con certbot
    # termina TLS y reenvia aqui en plano, mismo patron que portalFac.
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 512;

    # Página 404 con marca (Astro la genera en /404.html, propuesta 5 del
    # Artifact de 5 opciones, confirmada por el usuario — misma identidad
    # que portalFac/frontend/404-clarvo.html). Sin "=" después de 404: el
    # status code real se mantiene en 404, solo cambia el cuerpo servido
    # — mismo criterio que el 404-clarvo.html de portalFac.
    error_page 404 /404.html;

    # Assets con hash de contenido (/_astro/*) -- cacheables para siempre.
    location ^~ /_astro/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ~* \.(?:svg|png|jpg|jpeg|webp|gif|ico|woff2?|ttf|hdr)$ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # HTML nunca cacheado fuerte -- debe reflejar el ultimo deploy.
    location / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/index.html =404;
    }

    location = /health {
        include /etc/nginx/security-headers.conf;
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
